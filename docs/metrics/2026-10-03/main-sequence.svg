<text x="24" y="30" class="title" text-anchor="start">Abstractness vs instability</text>
<text x="24" y="50" class="subtitle" text-anchor="start">Each dot is a package. The diagonal A + I = 1 is the main sequence; D is the distance from it.</text>
<text x="24" y="66" class="subtitle" text-anchor="start">Shaded corners are where D &gt; 0.7: the zone of pain (bottom left) and the zone of uselessness (top right).</text>
